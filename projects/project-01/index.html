<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Changer</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>Color Changer</h1>
      <p>Click a button to change the background.</p>
      <div class="buttons">
        <button class="color-btn" data-color="#f7d794">Sand</button>
        <button class="color-btn" data-color="#63cdda">Sky</button>
        <button class="color-btn" data-color="#cf6a87">Rose</button>
        <button class="color-btn" data-color="#574b90">Purple</button>
        <button id="reset-btn" type="button">Reset</button>
      </div>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
